<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro Contable - Control de Gastos e Ingresos</title>
    <style>
        :root {
            --primary: #0056b3;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --dark: #333;
            --light: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 20px;
            color: var(--dark);
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: var(--primary);
        }
        
        /* Tarjetas de Resumen */
        .summary-card {
            display: flex;
            justify-content: space-between;
            background: var(--light);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }
        .summary-item {
            text-align: center;
            flex: 1;
        }
        .summary-item h3 {
            margin: 0 0 10px 0;
            font-size: 1.1em;
            color: #666;
        }
        .summary-item p {
            margin: 0;
            font-size: 1.8em;
            font-weight: bold;
        }
        
        /* Colores de texto */
        .text-success { color: var(--success) !important; }
        .text-danger { color: var(--danger) !important; }
        .text-primary { color: var(--primary) !important; }
        
        /* Botones Generales */
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: background-color 0.3s;
        }
        .btn-add { background-color: var(--success); }
        .btn-add:hover { background-color: #218838; }
        .btn-delete { background-color: var(--danger); padding: 8px 12px; }
        .btn-delete:hover { background-color: #c82333; }
        
        /* Botón Guardar */
        .save-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .btn-save {
            background-color: var(--warning);
            color: #333;
            font-size: 1.2em;
            padding: 12px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-save:hover {
            background-color: #e0a800;
        }

        /* Tablas */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: var(--primary);
            color: white;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Libro Contable</h1>
    
    <div class="summary-card">
        <div class="summary-item">
            <h3>Total Ingresos</h3>
            <p id="total-ingresos" class="text-success">$0.00</p>
        </div>
        <div class="summary-item">
            <h3>Total Gastos (Deudas)</h3>
            <p id="total-gastos" class="text-danger">$0.00</p>
        </div>
        <div class="summary-item">
            <h3>Saldo Disponible</h3>
            <p id="saldo-total" class="text-primary">$0.00</p>
        </div>
    </div>

    <!-- BOTÓN DE GUARDADO -->
    <div class="save-container">
        <button class="btn-save" onclick="guardarDatos()">💾 Guardar Cambios</button>
    </div>

    <!-- SECCIÓN DE INGRESOS -->
    <div class="section-title">
        <h2>Ingresos</h2>
        <button class="btn-add" onclick="agregarFila('tabla-ingresos', 'ingreso')">+ Agregar Ingreso</button>
    </div>
    <table id="tabla-ingresos">
        <thead>
            <tr>
                <th>Descripción</th>
                <th style="width: 25%;">Monto ($)</th>
                <th style="width: 10%;">Acción</th>
            </tr>
        </thead>
        <tbody>
            <!-- Los datos se inyectarán aquí vía JavaScript -->
        </tbody>
    </table>

    <!-- SECCIÓN DE GASTOS -->
    <div class="section-title">
        <h2>Gastos y Deudas</h2>
        <button class="btn-add" onclick="agregarFila('tabla-gastos', 'gasto')">+ Agregar Gasto</button>
    </div>
    <table id="tabla-gastos">
        <thead>
            <tr>
                <th>Descripción</th>
                <th style="width: 25%;">Monto ($)</th>
                <th style="width: 10%;">Acción</th>
            </tr>
        </thead>
        <tbody>
            <!-- Los datos se inyectarán aquí vía JavaScript -->
        </tbody>
    </table>
</div>

<script>
    // 1. Datos por defecto (Los que me dictaste)
    const datosPorDefecto = {
        ingresos: [
            { desc: "Ingreso 1 de Julio", monto: 26000 },
            { desc: "Pensión mensual", monto: 11800 },
            { desc: "Ingreso extra mencionado", monto: 1400 }
        ],
        gastos: [
            { desc: "Betty (Señora de las comidas)", monto: 2600 },
            { desc: "Betty (Última semana de mayo)", monto: 2200 },
            { desc: "Señora Carmen", monto: 1100 },
            { desc: "Doctor Tomás (3 terapias de $350)", monto: 1050 },
            { desc: "Pedro (Muebles de la moto)", monto: 1500 },
            { desc: "Tarjeta Amiga (Fin mes de junio)", monto: 1600 },
            { desc: "Banco Azteca", monto: 1900 }
        ]
    };

    // Formateador de moneda
    const formateador = new Intl.NumberFormat('es-MX', {
        style: 'currency',
        currency: 'MXN'
    });

    // 2. Función para cargar los datos al iniciar la página
    function cargarDatos() {
        const guardado = localStorage.getItem('libroContableMama');
        let datos;

        if (guardado) {
            datos = JSON.parse(guardado); // Si hay datos guardados, usarlos
        } else {
            datos = datosPorDefecto; // Si no hay nada, usar los originales
        }

        renderizarTabla('tabla-ingresos', datos.ingresos, 'ingreso-val');
        renderizarTabla('tabla-gastos', datos.gastos, 'gasto-val');
        calcularTotales();
    }

    // 3. Función para pintar las tablas basándose en los datos
    function renderizarTabla(tablaId, filas, claseInput) {
        const tbody = document.getElementById(tablaId).getElementsByTagName('tbody')[0];
        tbody.innerHTML = ''; // Limpiar la tabla antes de llenarla

        filas.forEach(fila => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" value="${fila.desc}" oninput="calcularTotales()"></td>
                <td><input type="number" class="${claseInput}" value="${fila.monto}" min="0" step="0.01" oninput="calcularTotales()"></td>
                <td><button class="btn-delete" onclick="eliminarFila(this)">X</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 4. Función para GUARDAR los datos en el navegador
    function guardarDatos() {
        const datos = {
            ingresos: [],
            gastos: []
        };

        // Recopilar ingresos
        const filasIngresos = document.getElementById('tabla-ingresos').getElementsByTagName('tbody')[0].rows;
        for (let row of filasIngresos) {
            const desc = row.cells[0].getElementsByTagName('input')[0].value;
            const monto = parseFloat(row.cells[1].getElementsByTagName('input')[0].value) || 0;
            datos.ingresos.push({ desc, monto });
        }

        // Recopilar gastos
        const filasGastos = document.getElementById('tabla-gastos').getElementsByTagName('tbody')[0].rows;
        for (let row of filasGastos) {
            const desc = row.cells[0].getElementsByTagName('input')[0].value;
            const monto = parseFloat(row.cells[1].getElementsByTagName('input')[0].value) || 0;
            datos.gastos.push({ desc, monto });
        }

        // Guardar en LocalStorage
        localStorage.setItem('libroContableMama', JSON.stringify(datos));
        alert("✅ ¡Los datos se han guardado correctamente!");
    }

    // 5. Función para calcular sumatorias en tiempo real
    function calcularTotales() {
        let totalIngresos = 0;
        let totalGastos = 0;

        const ingresos = document.querySelectorAll('.ingreso-val');
        ingresos.forEach(input => { totalIngresos += parseFloat(input.value) || 0; });

        const gastos = document.querySelectorAll('.gasto-val');
        gastos.forEach(input => { totalGastos += parseFloat(input.value) || 0; });

        const saldo = totalIngresos - totalGastos;

        document.getElementById('total-ingresos').innerText = formateador.format(totalIngresos);
        document.getElementById('total-gastos').innerText = formateador.format(totalGastos);
        
        const saldoEl = document.getElementById('saldo-total');
        saldoEl.innerText = formateador.format(saldo);
        
        if(saldo < 0) {
            saldoEl.className = 'text-danger';
        } else {
            saldoEl.className = 'text-primary';
        }
    }

    // 6. Funciones para agregar o eliminar filas manualmente
    function agregarFila(tablaId, tipo) {
        const tbody = document.getElementById(tablaId).getElementsByTagName('tbody')[0];
        const tr = document.createElement('tr');
        const claseInput = tipo === 'ingreso' ? 'ingreso-val' : 'gasto-val';
        
        tr.innerHTML = `
            <td><input type="text" placeholder="Nueva descripción" oninput="calcularTotales()"></td>
            <td><input type="number" class="${claseInput}" value="0" min="0" step="0.01" oninput="calcularTotales()"></td>
            <td><button class="btn-delete" onclick="eliminarFila(this)">X</button></td>
        `;
        tbody.appendChild(tr);
        calcularTotales();
    }

    function eliminarFila(btn) {
        const fila = btn.parentNode.parentNode;
        fila.parentNode.removeChild(fila);
        calcularTotales();
    }

    // Iniciar el sistema al cargar la página
    window.onload = cargarDatos;
</script>

</body>
</html>
