<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro Contable - Control de Gastos e Ingresos</title>
    <style>
        :root {
            --primary: #0056b3;
            --success: #28a745;
            --danger: #dc3545;
            --dark: #333;
            --light: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 20px;
            color: var(--dark);
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: var(--primary);
        }
        .summary-card {
            display: flex;
            justify-content: space-between;
            background: var(--light);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #ddd;
        }
        .summary-item {
            text-align: center;
            flex: 1;
        }
        .summary-item h3 {
            margin: 0 0 10px 0;
            font-size: 1.1em;
            color: #666;
        }
        .summary-item p {
            margin: 0;
            font-size: 1.8em;
            font-weight: bold;
        }
        .text-success { color: var(--success) !important; }
        .text-danger { color: var(--danger) !important; }
        .text-primary { color: var(--primary) !important; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: var(--primary);
            color: white;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        .btn-add { background-color: var(--success); }
        .btn-add:hover { background-color: #218838; }
        .btn-delete { background-color: var(--danger); padding: 8px 12px; }
        .btn-delete:hover { background-color: #c82333; }
        
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Libro Contable</h1>
    
    <div class="summary-card">
        <div class="summary-item">
            <h3>Total Ingresos</h3>
            <p id="total-ingresos" class="text-success">$0.00</p>
        </div>
        <div class="summary-item">
            <h3>Total Gastos (Deudas)</h3>
            <p id="total-gastos" class="text-danger">$0.00</p>
        </div>
        <div class="summary-item">
            <h3>Saldo Disponible</h3>
            <p id="saldo-total" class="text-primary">$0.00</p>
        </div>
    </div>

    <div class="section-title">
        <h2>Ingresos</h2>
        <button class="btn-add" onclick="agregarFila('tabla-ingresos', 'ingreso')">+ Agregar Ingreso</button>
    </div>
    <table id="tabla-ingresos">
        <thead>
            <tr>
                <th>Descripción</th>
                <th style="width: 25%;">Monto ($)</th>
                <th style="width: 10%;">Acción</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="text" value="Ingreso 1 de Julio" oninput="calcularTotales()"></td>
                <td><input type="number" class="ingreso-val" value="26000" min="0" step="0.01" oninput="calcularTotales()"></td>
                <td><button class="btn-delete" onclick="eliminarFila(this)">X</button></td>
            </tr>
            <tr>
                <td><input type="text" value="Pensión mensual" oninput="calcularTotales()"></td>
                <td><input type="number" class="ingreso-val" value="11800" min="0" step="0.01" oninput="calcularTotales()"></td>
                <td><button class="btn-delete" onclick="eliminarFila(this)">X</button></td>
            </tr>
            <tr>
                <td><input type="text" value="Ingreso extra mencionado" oninput="calcularTotales()"></td>
                <td><input type="number" class="ingreso-val" value="1400" min="0" step="0.01" oninput="calcularTotales()"></td>
                <td><button class="btn-delete" onclick="eliminarFila(this)">X</button></td>
            </tr>
        </tbody>
    </table>

    <div class="section-title">
        <h2>Gastos y Deudas</h2>
        <button class="btn-add" onclick="agregarFila('tabla-gastos', 'gasto')">+ Agregar Gasto</button>
    </div>
    <table id="tabla-gastos">
        <thead>
            <tr>
                <th>Descripción</th>
                <th style="width: 25%;">Monto ($)</th>
                <th style="width: 10%;">Acción</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="text" value="Betty (Señora de las comidas)" oninput="calcularTotales()"></td>
                <td><input type="number" class="gasto-val" value="2600" min="0" step="0.01" oninput="calcularTotales()"></td>
                <td><button class="btn-delete" onclick="eliminarFila(this)">X</button></td>
            </tr>
            <tr>
                <td><input type="text" value="Betty (Última semana de mayo)" oninput="calcularTotales()"></td>
                <td><input type="number" class="gasto-val" value="2200" min="0" step="0.01" oninput="calcularTotales()"></td>
                <td><button class="btn-delete" onclick="eliminarFila(this)">X</button></td>
            </tr>
            <tr>
                <td><input type="text" value="Señora Carmen" oninput="calcularTotales()"></td>
                <td><input type="number" class="gasto-val" value="1100" min="0" step="0.01" oninput="calcularTotales()"></td>
                <td><button class="btn-delete" onclick="eliminarFila(this)">X</button></td>
            </tr>
            <tr>
                <td><input type="text" value="Doctor Tomás (3 terapias de $350)" oninput="calcularTotales()"></td>
                <td><input type="number" class="gasto-val" value="1050" min="0" step="0.01" oninput="calcularTotales()"></td>
                <td><button class="btn-delete" onclick="eliminarFila(this)">X</button></td>
            </tr>
            <tr>
                <td><input type="text" value="Pedro (Muebles de la moto)" oninput="calcularTotales()"></td>
                <td><input type="number" class="gasto-val" value="1500" min="0" step="0.01" oninput="calcularTotales()"></td>
                <td><button class="btn-delete" onclick="eliminarFila(this)">X</button></td>
            </tr>
            <tr>
                <td><input type="text" value="Tarjeta Amiga (Fin mes de junio)" oninput="calcularTotales()"></td>
                <td><input type="number" class="gasto-val" value="1600" min="0" step="0.01" oninput="calcularTotales()"></td>
                <td><button class="btn-delete" onclick="eliminarFila(this)">X</button></td>
            </tr>
            <tr>
                <td><input type="text" value="Banco Azteca" oninput="calcularTotales()"></td>
                <td><input type="number" class="gasto-val" value="1900" min="0" step="0.01" oninput="calcularTotales()"></td>
                <td><button class="btn-delete" onclick="eliminarFila(this)">X</button></td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // Formateador de moneda para que se vea exacto y profesional
    const formateador = new Intl.NumberFormat('es-MX', {
        style: 'currency',
        currency: 'MXN'
    });

    function calcularTotales() {
        let totalIngresos = 0;
        let totalGastos = 0;

        // Sumar ingresos
        const ingresos = document.querySelectorAll('.ingreso-val');
        ingresos.forEach(input => {
            const valor = parseFloat(input.value) || 0;
            totalIngresos += valor;
        });

        // Sumar gastos
        const gastos = document.querySelectorAll('.gasto-val');
        gastos.forEach(input => {
            const valor = parseFloat(input.value) || 0;
            totalGastos += valor;
        });

        // Calcular saldo
        const saldo = totalIngresos - totalGastos;

        // Actualizar el DOM
        document.getElementById('total-ingresos').innerText = formateador.format(totalIngresos);
        document.getElementById('total-gastos').innerText = formateador.format(totalGastos);
        
        const saldoEl = document.getElementById('saldo-total');
        saldoEl.innerText = formateador.format(saldo);
        
        // Cambiar color del saldo si es negativo
        if(saldo < 0) {
            saldoEl.className = 'text-danger';
        } else {
            saldoEl.className = 'text-primary';
        }
    }

    function agregarFila(tablaId, tipo) {
        const tbody = document.getElementById(tablaId).getElementsByTagName('tbody')[0];
        const nuevaFila = tbody.insertRow();
        
        const claseInput = tipo === 'ingreso' ? 'ingreso-val' : 'gasto-val';
        
        nuevaFila.innerHTML = `
            <td><input type="text" placeholder="Descripción de la cuenta" oninput="calcularTotales()"></td>
            <td><input type="number" class="${claseInput}" value="0" min="0" step="0.01" oninput="calcularTotales()"></td>
            <td><button class="btn-delete" onclick="eliminarFila(this)">X</button></td>
        `;
        calcularTotales();
    }

    function eliminarFila(btn) {
        const fila = btn.parentNode.parentNode;
        fila.parentNode.removeChild(fila);
        calcularTotales();
    }

    // Calcular por primera vez al cargar la página
    window.onload = calcularTotales;
</script>

</body>
</html>
